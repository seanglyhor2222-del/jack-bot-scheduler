<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <title>Login - Jack Bot</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container" style="max-width: 400px; margin: 80px auto;">
    <h1 style="text-align:center; color:#667eea;">🤖 Telegram Bot</h1>

    <form method="POST" action="/login">
      <div class="form-group">
        <label>👤 ឈ្មោះអ្នកប្រើ</label>
        <input type="text" name="username" required autofocus>
      </div>
      <div class="form-group">
        <label>🔑 ពាក្យសម្ងាត់</label>
        <input type="password" name="password" required>
      </div>
      <button type="submit" class="btn-schedule" style="width: 100%;">
        🔓 ចូល
      </button>
    </form>
  </div>
</body>
</html>
