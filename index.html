<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Telegram Bot Scheduler</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">

    <!-- Header -->
    <div class="header">
      <h1>🤖 Telegram Bot Scheduler</h1>
      <a href="/logout" class="logout-btn">🚪 ចាកចេញ</a>
    </div>

    <!-- Tabs -->
    <div class="tabs">
      <button class="tab-btn active" data-tab="bots">
        🤖 គ្រប់គ្រង Bot
        <span class="tab-badge" id="botsBadge">0</span>
      </button>
      <button class="tab-btn" data-tab="send">
        📤 ផ្ញើសារ
      </button>
      <button class="tab-btn" data-tab="schedules">
        📋 បញ្ជីកាលវិភាគ
        <span class="tab-badge" id="schedulesBadge">0</span>
      </button>
    </div>

    <!-- Hidden -->
    <input type="hidden" id="editingBotId" value="">
    <input type="hidden" id="editingScheduleId" value="">

    <!-- ========== TAB 1: គ្រប់គ្រង Bot ========== -->
    <div class="tab-content active" id="tab-bots">
      <h2>🤖 គ្រប់គ្រង Bot</h2>

      <div class="form-group">
        <label>📝 ឈ្មោះ Bot</label>
        <input type="text" id="botName" placeholder="ឧទាហរណ៍៖ Jack Main Bot">
      </div>

      <div class="form-group">
        <label>🔑 Bot Token <span class="hint">(From BotFather telegram)</span></label>
        <input type="text" id="botToken" placeholder="123456:ABC-DEF...">
      </div>

      <div class="form-group">
        <label>💬 Chat ID</label>
        <input type="text" id="botChatId" placeholder="-100...">
      </div>

      <div class="button-group">
        <button id="addBotBtn" class="btn-schedule">➕ បន្ថែម Bot</button>
        <button id="saveBotBtn" class="btn-save" style="display:none;">💾 រក្សាទុក</button>
        <button id="cancelEditBtn" class="btn-cancel" style="display:none;">❌ បោះបង់</button>
      </div>

      <h3>📋 បញ្ជី Bot</h3>
      <div id="botList" class="bot-list"></div>
    </div>

    <!-- ========== TAB 2: ផ្ញើសារ ========== -->
    <div class="tab-content" id="tab-send">
      <h2>📤 ផ្ញើសារ</h2>

      <div class="form-group">
        <label>🤖 ជ្រើស Bot</label>
        <select id="botSelect">
          <option value="">-- ជ្រើស Bot --</option>
        </select>
      </div>

      <div class="form-group">
        <label>💬 អត្ថបទសារ</label>
        <textarea id="messageInput" rows="4" placeholder="វាយសាររបស់អ្នកនៅទីនេះ..." 
            oninput="autoResize(this)"></textarea>
      </div>

      <button id="sendBtn" class="btn-send" style="width:100%;">
        📤 ផ្ញើភ្លាមៗ
      </button>

      <h2>⏰ កំណត់កាលវិភាគ</h2>

      <div class="form-group">
        <label>🔁 ប្រភេទកាលវិភាគ</label>
        <select id="scheduleType" onchange="toggleScheduleType()">
          <option value="once">📅 ម្តងតែមួយ</option>
          <option value="daily">🔄 រៀងរាល់ថ្ងៃ</option>
          <option value="weekly">📆 រៀងរាល់សប្តាហ៍</option>
          <option value="monthly">🗓️ រៀងរាល់ខែ</option>
        </select>
      </div>

      <div class="form-group" id="dateGroup">
        <label>📅 ជ្រើសកាលបរិច្ឆេទ</label>
        <input type="date" id="dateInput">
      </div>

      <div class="form-group" id="weekdayGroup" style="display:none;">
        <label>📆 ជ្រើសថ្ងៃក្នុងសប្តាហ៍</label>
        <div class="weekday-checkboxes">
          <label class="weekday-item"><input type="checkbox" value="1" class="weekday-check"> ចន្ទ</label>
          <label class="weekday-item"><input type="checkbox" value="2" class="weekday-check"> អង្គារ</label>
          <label class="weekday-item"><input type="checkbox" value="3" class="weekday-check"> ពុធ</label>
          <label class="weekday-item"><input type="checkbox" value="4" class="weekday-check"> ព្រហស្បតិ៍</label>
          <label class="weekday-item"><input type="checkbox" value="5" class="weekday-check"> សុក្រ</label>
          <label class="weekday-item"><input type="checkbox" value="6" class="weekday-check"> សៅរ៍</label>
          <label class="weekday-item"><input type="checkbox" value="0" class="weekday-check"> អាទិត្យ</label>
        </div>
      </div>

      <div class="form-group" id="monthDayGroup" style="display:none;">
        <label>🗓️ ជ្រើសថ្ងៃក្នុងខែ</label>
        <select id="monthDayInput">
          <option value="">-- ជ្រើសថ្ងៃ --</option>
          <option value="1">ថ្ងៃទី ១</option>
          <option value="5">ថ្ងៃទី ៥</option>
          <option value="10">ថ្ងៃទី ១០</option>
          <option value="15">ថ្ងៃទី ១៥</option>
          <option value="20">ថ្ងៃទី ២០</option>
          <option value="25">ថ្ងៃទី ២៥</option>
          <option value="28">ថ្ងៃទី ២៨</option>
        </select>
      </div>

      <div class="form-group">
        <label>⏰ ជ្រើសម៉ោង</label>
        <input type="time" id="timeInput">
      </div>

      <button id="scheduleBtn" class="btn-schedule" style="width:100%;">
        ⏰ កំណត់កាលវិភាគ
      </button>
      <button id="cancelScheduleEditBtn" class="btn-cancel" style="width:100%; display:none; margin-top:10px;">
        ❌ បោះបង់ការកែកាលវិភាគ
      </button>
    </div>

    <!-- ========== TAB 3: បញ្ជីកាលវិភាគ ========== -->
    <div class="tab-content" id="tab-schedules">
      <h2>📋 បញ្ជីកាលវិភាគ</h2>
      <div id="scheduleList" class="schedule-list"></div>
    </div>

    <!-- Status (ជាប់ពេលជាមួយគ្រប់ Tab) -->
    <textarea id="status" class="status" readonly rows="3"></textarea>

  </div>

  <script src="script.js"></script>
</body>
</html>
